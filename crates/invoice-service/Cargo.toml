[package]
name = "invoice-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Outbound HTTP (webhook delivery). No TLS feature yet: add rustls when HTTPS endpoints must work.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "propagate-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.9"
# Opaque pagination cursors (url-safe base64); a tiny standard crate instead of a hand-rolled codec.
base64 = "0.22"
# Runtime queries only: the query! macros are never used; "macros" is needed for migrate!. TLS is off: the database is on a private network.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "chrono"] }

